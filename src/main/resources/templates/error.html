<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Błąd — FitAdmin</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" href="/images/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card text-center animate-in" style="max-width:500px;">
      <div style="font-size:4rem;margin-bottom:1rem;">
        <i data-lucide="alert-triangle" style="width:64px;height:64px;color:var(--accent-orange);"></i>
      </div>
      <h1 style="font-size:3rem;font-weight:900;margin-bottom:0.5rem;" th:text="${status ?: '404'}">404</h1>
      <p class="text-lg" style="color:var(--text-secondary);margin-bottom:0.5rem;" th:text="${error ?: 'Nie znaleziono strony'}">Nie znaleziono strony</p>
      <p class="text-sm text-muted mb-4" th:text="${message ?: 'Strona, której szukasz, nie istnieje lub została przeniesiona.'}">Strona, której szukasz, nie istnieje lub została przeniesiona.</p>
      <div class="flex gap-2 justify-center">
        <a th:href="@{/}" href="/" class="btn btn-primary">
          <i data-lucide="home" style="width:16px;height:16px;"></i> Strona główna
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Wróć
        </a>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
