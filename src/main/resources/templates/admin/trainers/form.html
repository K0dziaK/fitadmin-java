<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${trainerForm?.id != null ? 'Edytuj' : 'Dodaj'} + ' trenera — FitAdmin'">Trener — FitAdmin</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" href="/images/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div th:replace="~{fragments/navbar :: authenticated}"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-section"><div class="sidebar-title">Zarządzanie</div>
        <a href="/admin/dashboard.html"><i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i> Dashboard</a>
        <a href="/admin/classes/list.html"><i data-lucide="dumbbell" style="width:18px;height:18px;"></i> Zajęcia</a>
        <a href="/admin/trainers/list.html" class="active"><i data-lucide="users" style="width:18px;height:18px;"></i> Trenerzy</a>
        <a href="/admin/membership-types/list.html"><i data-lucide="credit-card" style="width:18px;height:18px;"></i> Typy karnetów</a>
      </div>
    </aside>
    <div class="admin-content">
      <div class="page-header">
        <div class="breadcrumb"><a th:href="@{/admin}">Admin</a><span>/</span><a th:href="@{/admin/trainers}">Trenerzy</a><span>/</span><span th:text="${trainerForm?.id != null ? 'Edytuj' : 'Dodaj'}">Dodaj</span></div>
        <h1 th:text="${trainerForm?.id != null ? 'Edytuj trenera' : 'Dodaj nowego trenera'}">Dodaj nowego trenera</h1>
      </div>
      <div class="card" style="max-width:600px;">
        <form th:action="${trainerForm?.id != null ? '/admin/trainers/' + trainerForm.id + '/edit' : '/admin/trainers/new'}" th:object="${trainerForm}" method="post">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="firstName">Imię</label>
              <input type="text" id="firstName" th:field="*{firstName}" class="form-input" placeholder="Anna" required/>
              <p class="form-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Nazwisko</label>
              <input type="text" id="lastName" th:field="*{lastName}" class="form-input" placeholder="Nowak" required/>
              <p class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-input" placeholder="anna@fitadmin.pl" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Telefon</label>
            <input type="tel" id="phone" th:field="*{phone}" class="form-input" placeholder="+48 111 222 333"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="specialization">Specjalizacja</label>
            <input type="text" id="specialization" th:field="*{specialization}" class="form-input" placeholder="np. Yoga, Pilates, CrossFit"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="bio">Biografia</label>
            <textarea id="bio" th:field="*{bio}" class="form-input" rows="4" placeholder="Krótki opis doświadczenia..." style="resize:vertical;"></textarea>
          </div>
          <div class="flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary btn-lg"><i data-lucide="save" style="width:18px;height:18px;"></i> Zapisz</button>
            <a th:href="@{/admin/trainers}" href="/admin/trainers/list.html" class="btn btn-secondary btn-lg">Anuluj</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script th:src="@{/js/app.js}" src="/js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
