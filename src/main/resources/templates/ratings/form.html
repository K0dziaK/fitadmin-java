<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oceń zajęcia — FitAdmin</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" href="/images/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div th:replace="~{fragments/navbar :: authenticated}"></div>

  <main class="container" style="padding-top:1rem;padding-bottom:3rem;">
    <div class="page-header">
      <div class="breadcrumb"><a th:href="@{/dashboard}">Dashboard</a><span>/</span><a th:href="@{/classes/my-reservations}">Rezerwacje</a><span>/</span><span>Oceń</span></div>
      <h1>Oceń zajęcia</h1>
      <p>Podziel się swoją opinią o zajęciach <strong th:text="${className ?: 'Yoga poranna'}">Yoga poranna</strong> z <strong th:text="${trainerName ?: 'Anną Nowak'}">Anną Nowak</strong>.</p>
    </div>

    <div class="card" style="max-width:500px;">
      <form th:action="@{/classes/{id}/rate(id=${classId})}" action="#" method="post">
        <div class="form-group text-center">
          <label class="form-label" style="font-size:1rem;">Twoja ocena</label>
          <input type="hidden" name="rating" id="ratingValue" value="0"/>
          <div class="stars" style="font-size:2rem;justify-content:center;margin:1rem 0;">
            <i data-lucide="star" style="width:36px;height:36px;"></i>
            <i data-lucide="star" style="width:36px;height:36px;"></i>
            <i data-lucide="star" style="width:36px;height:36px;"></i>
            <i data-lucide="star" style="width:36px;height:36px;"></i>
            <i data-lucide="star" style="width:36px;height:36px;"></i>
          </div>
          <p class="text-sm text-muted" id="ratingLabel">Kliknij gwiazdkę, aby ocenić</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="comment">Komentarz (opcjonalnie)</label>
          <textarea id="comment" name="comment" class="form-input" rows="4" placeholder="Co Ci się podobało? Co można poprawić?" style="resize:vertical;"></textarea>
        </div>

        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary btn-lg"><i data-lucide="send" style="width:18px;height:18px;"></i> Wyślij ocenę</button>
          <a th:href="@{/classes/my-reservations}" href="/classes/my-reservations.html" class="btn btn-secondary btn-lg">Anuluj</a>
        </div>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script th:src="@{/js/app.js}" src="/js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
