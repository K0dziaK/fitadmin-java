<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logowanie — FitAdmin</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" href="/images/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card animate-in">
      <div class="text-center mb-4">
        <a th:href="@{/}" href="/" class="navbar-brand" style="justify-content:center;">
          <img th:src="@{/images/logo.svg}" src="/images/logo.svg" alt="FitAdmin" style="width:40px;height:40px;"/>
          <span style="font-size:1.5rem;">Fit<span class="brand-accent">Admin</span></span>
        </a>
      </div>
      <h1>Witaj ponownie</h1>
      <p class="subtitle">Zaloguj się do swojego konta</p>

      <!-- Alert: błąd logowania -->
      <div th:if="${param.error}" class="alert alert-error">
        <i data-lucide="alert-circle" style="width:18px;height:18px;"></i>
        Nieprawidłowy email lub hasło.
      </div>

      <!-- Alert: wylogowanie -->
      <div th:if="${param.logout}" class="alert alert-info">
        <i data-lucide="check-circle" style="width:18px;height:18px;"></i>
        Zostałeś pomyślnie wylogowany.
      </div>

      <!-- Alert: po rejestracji -->
      <div th:if="${param.registered}" class="alert alert-success">
        <i data-lucide="check-circle" style="width:18px;height:18px;"></i>
        Rejestracja udana! Zaloguj się.
      </div>

      <form th:action="@{/login}" action="#" method="post">
        <div class="form-group">
          <label class="form-label" for="email">Adres e-mail</label>
          <input type="email" id="email" name="username" class="form-input" placeholder="jan@example.com" required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Hasło</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
          <i data-lucide="log-in" style="width:18px;height:18px;"></i> Zaloguj się
        </button>
      </form>

      <div class="auth-footer">
        Nie masz konta? <a th:href="@{/register}" href="/auth/register.html">Zarejestruj się</a>
      </div>
    </div>
  </div>
  <script th:src="@{/js/app.js}" src="/js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
